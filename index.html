<body>

  <main>
  <!-- Время вверху -->
  <div id="currentDateTime">
    Загрузка... дата и время
  </div>

  <h1>Запись на баскетбол в Ярославле</h1>

  <!-- Зал -->
  <div class="form-row">
    <label>Выбери зал:</label>
    <select id="hallSelect">
      <option value="hall1">ЛОКОМОТИВ</option>
      <option value="hall2">АТЛАНТ</option>

  </div>

  <div id="nearestGameInfo">
    Ближайшая игра: не выбран зал
  </div>

  <div class="form-row">
    <label for="playerName">Введи ФИО:</label>
    <input type="text" id="playerName" placeholder="Иванов Иван Иванович" list="playersList" maxlength="50" pattern="[A-Za-zА-Яа-яЁё\s\-]{3,}" oninput="this.value = this.value.replace(/[^A-Za-zА-Яа-яЁё\s\-]/g, '');"/>
  </div>
  <span id="playerNameError" style="color: red; font-size: 12px; display: none; margin-left: 82px; margin-top: 4px;">
    ФИО должно состоять из трёх слов: Фамилия Имя Отчество
  </span>

  <datalist id="playersList"></datalist>

  <button
    onclick="addPlayer()"
    style="margin-bottom: 15px;">
    Записаться
  </button>

  <!-- мини-анимация после записи -->
  <div id="successAnimation" style="display: none; text-align: center; margin-top: 15px;"></div>

  <!-- Контейнер для тостов -->
  <div id="toastContainer"></div>
  <div id="result"></div>

  <!-- Строка расчёта суммы -->
  <div id="pricingRow">
    Стоимость к оплате: не выбран зал.
  </div>

  <!-- Длительность игры -->
  <div class="form-row">
    <label>Длительность игры:</label>
    <select id="durationSelect">
      <option value="full">2 часа</option>
      <option value="short">1 час 30 мин</option>
    </select>
  </div>

  <!-- График игр (скрытый по умолчанию) -->
  <div id="scheduleContainer" style="margin-top: 20px; display: none;">
    <h2>График игр в выбранном зале</h2>
    <div id="scheduleContent"></div>
  </div>

    <!-- Блок таблицы истории записей по датам (прямо после списка участников) -->
  <div id="historyTableContainer" style="margin-top: 12px; display: none;"></div>

  <!-- Модальное окно -->
  <div id="teamsModal">
    <div class="modal-content">
      <div class="modal-header">
        <strong>Сформированные команды</strong>
        <span class="modal-close-btn" onclick="closeTeamsModal()">×</span>
      </div>

      <div id="teamsContent" class="teams-list"></div>

      <div class="modal-footer">
        <button class="reroll-btn" onclick="rerollTeams()">🎲 Перемешать</button>
        <button class="modal-btn-close" onclick="closeTeamsModal()">Закрыть</button>
      </div>
    </div>
  </div>
  
  <script>

    // Базовый URL API
    const API_BASE_URL = 'http://localhost:8080';                     // локальный Docker
    // const API_BASE_URL = 'https://ball76.up.railway.app';          // продакшен (Railway)
    // const API_BASE_URL = 'https://ball76.shares.zrok.io';          // zrok-туннель (нестабильно из РФ)

    const MAX_PLAYERS = 18;

    // Стоимость для залов (если больше 500, считаем деление)
    const hallPrice = {
      "hall1": 6000,
      "hall2": 350
    };

    // Тарифы по времени аренды
    const hallPriceByDuration = {
      hall1: {
        full:  6000,   // 2 часа
        short: 4500    // 1.5 часа
      },
      hall2: {
        full:  0,   // 2 часа
        short: 0    // 1.5 часа = 3500 / 2 * 1.5
      }
    };

    // Телефоны ответственных
    const hallPhone = {
      hall1: "+7 (961) 154-44-11",   // Андрей Дубровин
      hall2: "+7 (910) 979-22-99"    // Ярослав Волков
    };

    let playersByHall = { hall1: [], hall2: [] };
    let playerNames = [];  
    let historyByDate = {};
    let lastNearestDate = null;

    document.getElementById('durationSelect').value = 'full';

// ==== Тосты (уведомления) ====
    function showToast(message, type = 'info', duration = 3500) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.textContent = message;
      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add('hiding');
        toast.addEventListener('animationend', () => toast.remove());
      }, duration);
    }

// Копировать телефон в буфер
    async function copyPhoneToClipboard(phone) {
      try {
        await navigator.clipboard.writeText(phone);
        showToast('Телефон скопирован', 'success', 2000);
      } catch (err) {
        console.error('Не удалось скопировать телефон:', err);
        showToast('Не удалось скопировать телефон', 'error');
      }
    }

  async function loadFromAPI() {
    try {
      // 1. Игроки и текущий playersByHall
      const hall = document.getElementById('hallSelect').value;
      const dateStr = getNearestGameDate(hall);
      const response = await fetch(
        `${API_BASE_URL}/api/players/${hall}/${dateStr}`
      );

      if (!response.ok) throw new Error('Не удалось загрузить участников');

      const data = await response.json();

      playersByHall = data.playersByHall || { hall1: [], hall2: [] };



      // 2. НОВЫЙ БЛОК: история записей из базы (все игры)
      const historyResponse = await fetch(
        `${API_BASE_URL}/api/history`
      );

      if (!historyResponse.ok) throw new Error('Не удалось загрузить историю');

      const historyData = await historyResponse.json();
      historyByDate = historyData.historyByDate || {};



      // 3. Собрать playerNames из базы (игроки + истории)
      const allNames = new Set();
      Object.values(playersByHall).forEach(hallPlayers => {
        hallPlayers.forEach(name => {
          if (name) allNames.add(name);
        });
      });

      Object.keys(historyByDate).forEach(dateStr => {
        const dateData = historyByDate[dateStr];
        for (const hallId in dateData) {
          const players = dateData[hallId] || [];
          players.forEach(name => {
            if (name) allNames.add(name.trim());
          });
        }
      });

      playerNames = Array.from(allNames);
    } catch (err) {
      console.error('Ошибка при запросе API:', err);
      playersByHall = { hall1: [], hall2: [] };
      historyByDate = {};
      playerNames = [];
    }

    updatePlayersList();
    showList();
  }



    // Показать текущие дата и время
    function showCurrentDateTime() {
      const now = new Date();
      const options = {
        weekday: 'short',
        year: 'numeric',
        month: 'short',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      };
      const dtText = now.toLocaleString('ru-RU', options)
        .replace(',', '')
        .replace('г.', 'г.');
      document.getElementById('currentDateTime').textContent =
        'Сегодня: ' + dtText;
    }

    // ФИО из истории
    function collectAllNamesFromHistory() {
      const allNames = new Set();

      // из playerNames
      playerNames.forEach(name => {
        if (name) allNames.add(name.trim());
      });

      // из historyByDate[hall1] и historyByDate[hall2]
      for (const dateStr in historyByDate) {
        const dateData = historyByDate[dateStr];
        for (const hallId in dateData) {
          const players = dateData[hallId] || [];
          players.forEach(name => {
            if (name) allNames.add(name.trim());
          });
        }
      }

      return Array.from(allNames);
    }

    // Показать историю записей в виде таблицы под списком участников
    function showHistoryTable() {
      const hall = document.getElementById('hallSelect').value;
      const histName = hall === 'hall1' ? 'ЛОКОМОТИВ' : 'АТЛАНТ';

      const historyTableContainer = document.getElementById('historyTableContainer');
      historyTableContainer.innerHTML = '';
      historyTableContainer.style.display = 'none';

      if (!hall) {
        return;
      }

      // собрать записи только для этого зала: { date: "2026-04-19", players: [...] }
      let entries = [];

      Object.keys(historyByDate).forEach(dateStr => {
        const hallData = historyByDate[dateStr][hall] || [];
        if (hallData.length > 0) {
          entries.push({
            date: dateStr,
            players: hallData
          });
        }
      });

      if (entries.length === 0) {
        return;
      }

      historyTableContainer.style.display = 'block';

      // Твоя сортировка + 2 записи
      entries.sort((a, b) => {
        if (a.date < b.date) return 1;
        if (a.date > b.date) return -1;
        return 0;
      });
      entries = entries.slice(0, 2);

      // формируем блочную «карточку» для каждой даты (как в расписании)
      let html = `
        <h3 style="
          color: #a0e0ff;
          margin-top: 14px;
          margin-bottom: 8px;
          font-size: 16px;">
          История записей в зале ${histName} по датам
        </h3>

        <div style="
          display: flex;
          flex-direction: column;
          gap: 10px;">
      `;

      entries.forEach(entry => {
        const dateStr = entry.date;
        const players = entry.players;

        html += `
          <div style="
            padding: 10px;
            border-radius: 4px;
            background: #222;
            border: 1px solid #404040;
            font-size: 13px;
            color: #e0e0e0;">

            <div style="
              font-weight: 600;
              color: #a0e0ff;
              margin-bottom: 4px;">
              ${dateStr}
            </div>

            <div style="
              line-height: 1.5;">
              ${players.join(', ')}
            </div>
          </div>
        `;
      });

      html += '</div>';

      historyTableContainer.innerHTML = html;
    }

    // Фильтр только прошедших сессий для счётчика.
    // Даты игр — московские, поэтому и «сейчас» берём в МСК (getMSKNow),
    // иначе игрок из другого часового пояса увидит неверный счётчик визитов.
    function getPastSessions(playerSessions) {
      const now = getMSKNow();
      return playerSessions.filter(session => {
        const sessionDate = new Date(session.date + 'T' + session.time);
        return sessionDate < now;
      });
    }

    // Подсчёт записей игрока в зале (ТОЛЬКО ПРОШЕДШИЕ)
    function countPlayerVisits(historyByDate, playerName, hall) {
      let count = 0;
      for (let dateStr in historyByDate) {
        const dateData = historyByDate[dateStr];
        if (dateData[hall]) {
          // ФИЛЬТРУЕМ ТОЛЬКО ПРОШЕДШИЕ ДАТЫ
          const hallSessions = dateData[hall].map(p => ({
            date: dateStr,
            time: '21:00', // время по умолчанию из расписания
            name: p
          }));
          const pastSessions = getPastSessions(hallSessions);
          if (pastSessions.some(session => session.name === playerName)) {
            count++;
          }
        }
      }
      return count;
    }

    // Показать список участников с inline-редактированием и подсчётом суммы
    function showList() {
      const hall = document.getElementById('hallSelect').value;
      const result = document.getElementById('result');
      const priceElem = document.getElementById('pricingRow');
      const players = playersByHall[hall] || [];

      const currentPlayers = players.length;

      // Вывод списка
      if (!hall) {
        result.innerHTML = '<p>Выберите зал, чтобы увидеть список участников.</p>';
        priceElem.textContent = 'Стоимость к оплате: не выбран зал.';
        return;
      }

      // Выбранный зал и ответственный перед списком
      const sel = document.getElementById('hallSelect');
      const hallText = sel.options[sel.selectedIndex].text;

      const parts = hallText.split(' [Отв. ');
      const hallName = parts[0];
      const resp = parts[1] ? parts[1].replace(']', '') : '';

      result.innerHTML = `
        <div style="
          display: flex;
          align-items: center;
          justify-content: space-between;
          font-size: 20px;
          font-weight: 600;
          color: #ffffff;
          margin-bottom: 14px;
          padding-bottom: 6px;
          border-bottom: 1px solid #404040;">
          <span>
            Все записавшиеся в <span style="color: #a0e0ff;">${hallName}</span>
          </span>
          <span
            style="cursor: pointer; color: red;"
            title="Сформировать команды"
            onclick="openTeamsModal()">
            🎲
          </span>
        </div>

        ${resp ? `
          <div style="
            font-size: 13px;
            margin-bottom: 14px;
            color: #b0ffa0;">
            Ответственный: ${resp}
          </div>
        ` : ''}
      `;

      if (players.length === 0) {
        result.innerHTML += '<p>Список пока пуст.</p>';
      } else {
        const list = players.map((name, i) => {
          const idx = i + 1;
          const isLimited = idx <= MAX_PLAYERS;
          const colorStyle = isLimited ? '' : 'color: red;';
          const nameStyle = isLimited ? '' : 'color: red;';
          return `
            <div class="playerLine" id="playerLine${i}" style="${nameStyle}">
            <div class="playerName">
              <span style="${nameStyle}">${idx}. ${name} 
              <span style="color: #a0e0ff; font-size: 12px; float: right; margin-left: auto;">${countPlayerVisits(historyByDate, name, hall)} <span style="color: #90ff90;"> +1</span></span>
              </span>
              <input type="text" id="nameEdit${i}" value="${name}" style="display: none; width: 250px; padding: 2px;" />
            </div>
              <div class="icons">
                <span onclick="startEdit(${i})" style="cursor: pointer; margin-right: 6px;">✎</span>
                <span onclick="submitEdit(${i})" style="display: none; cursor: pointer; margin-right: 6px; color: green;">✔</span>
                <span onclick="cancelEdit(${i})" style="display: none; cursor: pointer; margin-right: 6px; color: gray;">✖</span>
                <span onclick="removePlayer(${i})" style="cursor: pointer; color: red;">🗑️</span>
              </div>
            </div>
          `;
        }).join('');
        result.innerHTML += list;
      }

      // === Индикатор заполненности ===
      const activeCount = Math.min(MAX_PLAYERS, players.length);
      const perc = Math.min(100, (players.length / MAX_PLAYERS) * 100);
      const barColor = players.length < 10 ? '#c62828' : '#2e7d32';   // < 10 — красный, ≥10 — зелёный

      result.innerHTML += `
        <div style="margin-top: 12px; font-size: 13px; color: #b0b0b0;">
          Заполненность:
          <span style="color: #ffffff;">
            ${players.length} / ${MAX_PLAYERS} человек
          </span>
          <div style="margin-top: 4px; height: 8px; background: #444; border-radius: 4px; overflow: hidden;">
            <div style="
              height: 100%;
              width: ${perc}%;
              background: ${barColor};
              border-radius: 4px;
              transition: width 0.3s ease;">
            </div>
          </div>
        </div>
      `;


      // Подсчёт и отображение суммы к оплате на человека
      const hallKey = hall;
      //const price = hallPrice[hallKey] || 0;

      const durationSelect = document.getElementById('durationSelect');
      const durationKey = durationSelect ? durationSelect.value : 'full';   // по умолчанию 2 часа
      const price = hallPriceByDuration[hall]?.[durationKey] || hallPrice[hall] || 0;
      const durationText = durationKey === 'full' ? '2 часа' : durationKey === 'short' ? '1 час 30 мин' : '';

      if (price > 500 && players.length > 0) {
        const activeCount = Math.min(MAX_PLAYERS, players.length);
        const perPerson = (price / activeCount).toFixed(2);
        const isUnder10 = players.length < 10;
        const mainBg = isUnder10 ? '#501010' : '#1a4b1a';   // фон #pricingRow
        const borderCol = isUnder10 ? '#a03030' : '#006633'; // рамка #pricingRow
        const phoneBg = isUnder10 ? '#501010' : '#224422';   // фон блока с телефоном

        const priceElem = document.getElementById('pricingRow');
        priceElem.style.background = mainBg;
        priceElem.style.borderColor = borderCol;

        priceElem.innerHTML = `
          <div style="font-size: 13px; margin-bottom: 4px;">
            Стоимость зала: ${price} ₽
          </div>
          <div style="font-size: 13px; margin-bottom: 4px;">
            Время аренды: ${durationText}
          </div>
          <div style="font-size: 13px;">
            Оплачивать будут ${activeCount} человек (${activeCount} в пределах лимита)
          </div>
          <div style="font-size: 13px; margin-top: 4px;">
            <strong>Каждому нужно заплатить: ${perPerson} ₽</strong>
          </div>

          <div style="
            margin-top: 10px;
            padding: 8px 10px;
            background: ${phoneBg};
            border-radius: 4px;
            border: 1px solid #336633;
            font-size: 13px;
            color: #e0ffe0;">
            Для оплаты переведите деньги на телефон:
            <br />
            <span style="color: #ffffff; font-weight: bold; margin: 0 4px;" id="displayPhone">${hallPhone[hall]}</span>
            <button
              onclick="copyPhoneToClipboard('${hallPhone[hall]}')"
              style="
                margin-left: 6px;
                padding: 0;
                width: 20px;
                height: 20px;
                border: none;
                background: transparent;
                color: #a0e0ff;
                font-size: 15px;
                cursor: pointer;"
              title="Копировать телефон">
              📋
            </button>
          </div>
        `;
      } else {
        priceElem.style.background = '#1a4b1a';
        priceElem.style.borderColor = '#404040';
        priceElem.innerHTML = `
          Стоимость зала: ${price} ₽.<br>
          Для этого зала не производится деление на участников или участников нет.
        `;
      }

      showHistoryTable(); 

      //document.getElementById('durationSelect').value = players.length >= 15 ? 'full' : 'short';

    }

    // Начать редактирование (показать инпут)
    function startEdit(index) {
      const line = document.getElementById(`playerLine${index}`);
      const span = document.querySelector(`#playerLine${index} .playerName span`);
      const input = document.getElementById(`nameEdit${index}`);

      const startIcon = document.querySelector(`span[onclick="startEdit(${index})"]`);
      const submitIcon = document.querySelector(`span[onclick="submitEdit(${index})"]`);
      const cancelIcon = document.querySelector(`span[onclick="cancelEdit(${index})"]`);

      span.style.display = 'none';
      input.style.display = 'inline-block';
      input.focus();
      input.select();

      startIcon.style.display = 'none';
      submitIcon.style.display = 'inline-block';
      cancelIcon.style.display = 'inline-block';

      // Enter — сохранить, ESC — отменить
      input.onkeydown = function (e) {
        if (e.key === 'Enter') { e.preventDefault(); submitEdit(index); }
        if (e.key === 'Escape') { e.preventDefault(); cancelEdit(index); }
      };
    }

  
    // Сохранить редактирование
    
    // отправить изменения на сервер
async function submitEdit(index) {
  const input = document.getElementById(`nameEdit${index}`);
  const newName = input.value.trim();
  const hall = document.getElementById('hallSelect').value;

  if (!newName) {
    showToast('Введите корректное ФИО', 'error');
    return;
  }

  // проверка формата ФИО: минимум 3 слова
  const parts = newName.split(/\s+/).filter(word => word.length > 0);
  if (parts.length < 3) {
    showToast('ФИО должно состоять из трёх слов: Фамилия Имя Отчество', 'error');
    return;
  }

  const oldName = playersByHall[hall][index];

  if (newName === oldName) {
    cancelEdit(index);
    return;
  }

  try {
    const response = await fetch(
      `${API_BASE_URL}/api/player/name`,
      {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ currentName: oldName, newName })
      }
    );

    if (!response.ok) {
      const data = await response.json();
      throw new Error(data.error || 'Не удалось изменить игрока');
    }

    const result = await response.json();
    playersByHall = result.playersByHall;

    // Обновить playerNames в глобальном списке
    const idxInNames = playerNames.indexOf(oldName);
    if (idxInNames !== -1) {
      playerNames[idxInNames] = newName;
    }


    // Обновить историю и список
    await loadFromAPI();

    // ===============================
    // Ближайшая встреча: дата + день недели
    // ===============================

    const dayNamesRU = {
      "Monday": "понедельник",
      "Tuesday": "вторник",
      "Wednesday": "среда",
      "Thursday": "четверг",
      "Friday": "пятница",
      "Saturday": "суббота",
      "Sunday": "воскресенье"
    };

    const scheduleDefs = [
      { hall: "hall1", day: "Tuesday",  from: 21, to: 23 },
      { hall: "hall1", day: "Thursday", from: 21, to: 23 },
      { hall: "hall2", day: "Friday",   from: 21, to: 23 }
    ];

    function getDayCode(dayName) {
      const map = {
        "Monday": 1,
        "Tuesday": 2,
        "Wednesday": 3,
        "Thursday": 4,
        "Friday": 5,
        "Saturday": 6,
        "Sunday": 7
      };
      return map[dayName] || 0;
    }
    
    // Текущая дата/день недели в московском времени (игры проходят по МСК).
    // ВАЖНО: нельзя использовать локальное время браузера — если пользователь
    // откроет страницу из другого часового пояса, «ближайшая игра» сдвинется.
    function getMSKNow() {
      const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Europe/Moscow',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      }).formatToParts(new Date());

      const get = type => parts.find(p => p.type === type).value;
      const d = new Date();
      d.setFullYear(+get('year'), +get('month') - 1, +get('day'));
      d.setHours(+get('hour') % 24, +get('minute'), +get('second'), 0);
      return d;
    }

    function getNearestGameDate(hall) {
  const now = getMSKNow();
  const nowWeekDay = now.getDay() || 7;

  let nearest = null;

  scheduleDefs
    .filter(item => item.hall === hall)
    .forEach(item => {
      const dayCode = getDayCode(item.day);
      const dayDiff = (dayCode - nowWeekDay + 7) % 7;

      if (!nearest || dayDiff < (nearest?.dayDiff ?? 999)) {
        nearest = { dayDiff, from: item.from, to: item.to };
      }
    });

  if (!nearest) return null;

  const nearestDate = new Date(now);
  nearestDate.setDate(now.getDate() + nearest.dayDiff);
  nearestDate.setHours(21, 0, 0, 0);  // жёстко 21:00

  // Дата уже московская (now построен по МСК) — форматируем напрямую,
  // без toISOString(), который перевёл бы её в UTC и мог сдвинуть день
  const y = nearestDate.getFullYear();
  const m = String(nearestDate.getMonth() + 1).padStart(2, '0');
  const day = String(nearestDate.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}


    function getNearestGameText(hall) {
  const now = getMSKNow();
  const nowWeekDay = now.getDay() || 7;  // 1–7, где 1=пн

  let nearest = null;

  scheduleDefs
    .filter(item => item.hall === hall)
    .forEach(item => {
      const dayCode = getDayCode(item.day);  // 1–7 из dayNamesRU
      const dayDiff = (dayCode - nowWeekDay + 7) % 7;

      // Считаем не от времени, а просто от дня недели
      // Нужна БЛИЖАЙШАЯ дата в будущем/сегодня, без учёта часов внутри дня
      let timeDiff = dayDiff * 24;  // только дни в часах

      if (!nearest || timeDiff < nearest.diff) {
        nearest = {
          diff: timeDiff,
          day: item.day,
          from: item.from,
          to: item.to
        };
      }
    });

  if (!nearest) {
    return "Ближайшая игра: не найдено";
  }

  const russianDay = dayNamesRU[nearest.day];

  // Ближайшая дата — это now + dayDiff дней, но с нулями по часам
  const nearestDate = new Date(now);
  nearestDate.setDate(now.getDate() + Math.floor(nearest.diff / 24));
  nearestDate.setHours(nearest.from, 0, 0, 0);

  const dateOptions = {
    day: "numeric",
    month: "short",
    weekday: "short",
    timeZone: "Europe/Moscow"
  };
  const parts = nearestDate.toLocaleString("ru-RU", dateOptions).split(" ");
  const dayNum = parts[1];
  const month = parts[2].replace(".", "");
  const weekday = parts[0].replace(",", "").charAt(0).toUpperCase() + parts[0].slice(1, -1);

  const fromStr = `${nearest.from}:00`;
  const toStr = `${nearest.to}:00`;

  return `Ближайшая игра: ${weekday}, ${dayNum} ${month}, в ${fromStr}`;
}


let isInitialLoad = true;

async function showNearestGame() {
  const hall = document.getElementById('hallSelect').value;
  const info = document.getElementById('nearestGameInfo');

  if (!hall) {

    return;

  // ПРИ СМЕНЕ ДАТЫ — ПЕРЕЗАГРУЗИТЬ СПИСОК

    } catch (e) {

}

    // выбрать ближайший зал как значение по умолчанию
    function selectNearestHall() {
      const now = getMSKNow();
      const nowWeekDay = now.getDay() || 7;
      const nowHour = now.getHours();

      let nearest = null;

      scheduleDefs.forEach(item => {
        const dayCode = getDayCode(item.day);
        const dayDiff = (dayCode - nowWeekDay + 7) % 7;
        const approximateHour = item.from;
        let timeDiff = dayDiff * 24 + (approximateHour - nowHour);

        if (timeDiff < 0) {
          timeDiff += 7 * 24;
        }

        if (!nearest || timeDiff < nearest.diff) {
          nearest = { diff: timeDiff, hall: item.hall };
        }
      });

      if (nearest) {
        document.getElementById('hallSelect').value = nearest.hall;
      }
    }




    window.addEventListener("DOMContentLoaded", async function () {
      // 1. Выбираем ближайший зал (showNearestGame сработает, но isInitialLoad=true → только текст)
      selectNearestHall();

      // 2. Загружаем данные
      await loadFromAPI();

      // 3. Фиксируем дату и обновляем текст (на случай если loadFromAPI перетёр)
      const hall = document.getElementById('hallSelect').value;
      if (hall) {
        lastNearestDate = getNearestGameDate(hall);
        document.getElementById('nearestGameInfo').textContent = getNearestGameText(hall);

    function openTeamsModal() {
      const hall = document.getElementById('hallSelect').value;
      const players = playersByHall[hall] || [];

      if (players.length === 0) {
        showToast("Сначала запишитесь хотя бы один участник", 'error');
        return;
      }

      const modal = document.getElementById('teamsModal');
      const content = document.getElementById('teamsContent');

      content.innerHTML = '';

      const numTeams = players.length >= 15 ? 3 : 2;

      // перемешать
      const shuffled = [...players].sort(() => 0.5 - Math.random());

      const teams = Array.from({ length: numTeams }, () => []);
      for (let i = 0; i < shuffled.length; i++) {
        teams[i % numTeams].push(shuffled[i]);
      }

      let inner = `
        <p style="margin-bottom: 8px; font-weight: 500;">
          Всего игроков: <strong>${players.length}</strong>
        </p>
        <p style="margin-bottom: 12px; font-weight: 500;">
          Сформировано команд: <strong>${numTeams}</strong>
        </p>
      `;

      teams.forEach((team, idx) => {
        const number = idx + 1;

        const items = team.map((name, i) => {
              // если это 6‑й игрок, добавляем отступ
              const extraStyle = i === 5 ? 'margin-top: 8px;' : '';
              return `
                <li class="team-player-item" style="margin: 2px 0; ${extraStyle}">
                  ${name}
                </li>
              `;
            }).join('');

            inner += `
              <div class="team-card">
                <div class="team-title">
                  Команда ${number} (${team.length} человек)
                </div>

                <div class="team-main">
                  <ol class="team-main-ol" style="margin: 0; padding-left: 20px; list-style-type: decimal;">
                    ${items}
                  </ol>
                </div>
              </div>
            `;
        });

      content.innerHTML = inner;

      modal.style.display = 'flex';
    }
