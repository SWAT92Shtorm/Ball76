<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Запись на баскетбол в Ярославле. Залы ЛОКОМОТИВ и АТЛАНТ. Расписание игр, стоимость, формирование команд. Присоединяйтесь к игре!" />
  <meta name="keywords" content="баскетбол, Ярославль, запись, игра, ЛОКОМОТИВ, АТЛАНТ, спортзал, команда" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://swat92shtorm.github.io/Ball76/" />
  <link rel="icon" type="image/png" href="ball.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Запись на баскетбол в Ярославле" />
  <meta property="og:description" content="Запись на баскетбол в Ярославле. Залы ЛОКОМОТИВ и АТЛАНТ. Расписание игр, стоимость, формирование команд." />
  <meta property="og:url" content="https://swat92shtorm.github.io/Ball76/" />
  <meta property="og:image" content="https://swat92shtorm.github.io/Ball76/ball.png" />
  <meta property="og:locale" content="ru_RU" />

  <title>Запись на баскетбол в Ярославле — ЛОКОМОТИВ и АТЛАНТ</title>

  <link rel="stylesheet" href="styles.css">

</head>
<body>

  <main>
  <!-- Время вверху -->
  <div id="currentDateTime">
    Загрузка... дата и время
  </div>

  <h1>Запись на баскетбол в Ярославле</h1>

  <!-- Зал -->
  <div class="form-row">
    <label>Выбери зал:</label>
    <select id="hallSelect">
      <option value="hall1">ЛОКОМОТИВ</option>
      <option value="hall2">АТЛАНТ</option>
    </select>
  </div>

  <div id="nearestGameInfo">
    Ближайшая игра: не выбран зал
  </div>

  <div class="form-row autocomplete-wrap">
    <label for="playerName">Введи ФИО:</label>
    <input type="text" id="playerName" placeholder="Иванов Иван Иванович" maxlength="50" pattern="[A-Za-zА-Яа-яЁё\s\-]{3,}" oninput="this.value = this.value.replace(/[^A-Za-zА-Яа-яЁё\s\-]/g, '');"/>
    <div id="autocompleteBox" class="autocomplete-box"></div>
  </div>
  <span id="playerNameError" class="name-error">
    ФИО должно состоять из 3–5 слов: Фамилия Имя Отчество
  </span>

  <button class="signup-btn" onclick="addPlayer()">
    Записаться
  </button>

  <!-- мини-анимация после записи -->
  <div id="successAnimation"></div>

  <!-- Контейнер для тостов -->
  <div id="toastContainer"></div>
  <div id="result"></div>

  <!-- Строка расчёта суммы -->
  <div id="pricingRow">
    Стоимость к оплате: не выбран зал.
  </div>

  <!-- Длительность игры -->
  <div class="form-row">
    <label>Длительность игры:</label>
    <select id="durationSelect">
      <option value="full">2 часа</option>
      <option value="short">1 час 30 мин</option>
    </select>
  </div>

  <!-- График игр (скрытый по умолчанию) -->
  <div id="scheduleContainer" class="schedule-block">
    <h2 class="schedule-title">📅 График игр — <span id="scheduleHallName"></span></h2>
    <div id="scheduleContent"></div>
  </div>

  <!-- Блок таблицы истории записей по датам (прямо после списка участников) -->
  <div id="historyTableContainer"></div>

  <!-- Модалка подтверждения удаления (UX3) -->
  <div id="deleteModal" class="modal-overlay">
    <div class="modal-content delete-modal-content">
      <div class="modal-header">
        <strong>Удалить участника?</strong>
        <span class="modal-close-btn" onclick="closeDeleteModal()">×</span>
      </div>
      <div class="delete-modal-text">
        Игрок <strong id="deleteModalName" class="delete-modal-name"></strong> будет удалён из списка записей.
      </div>
      <div class="modal-footer">
        <button class="modal-btn modal-btn-cancel" onclick="closeDeleteModal()">Отмена</button>
        <button class="modal-btn modal-btn-danger" onclick="confirmRemovePlayer()">Удалить</button>
      </div>
    </div>
  </div>

  <!-- Модальное окно -->
  <div id="teamsModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <strong>Сформированные команды</strong>
        <span class="modal-close-btn" onclick="closeTeamsModal()">×</span>
      </div>

      <div id="teamsContent" class="teams-list"></div>

      <div class="modal-footer">
        <button class="modal-btn modal-btn-primary" onclick="rerollTeams()">🎲 Перемешать</button>
        <button class="modal-btn modal-btn-cancel" onclick="closeTeamsModal()">Закрыть</button>
      </div>
    </div>
  </div>

  </main>

  <noscript>
    <p>Для записи на баскетбол включите JavaScript в браузере.</p>
  </noscript>

  <footer class="app-version">v2026.08.25-e</footer>

  <script src="app.js?v=20260825e"></script>
</body>
</html>
